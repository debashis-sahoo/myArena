openapi: 3.1.0
info:
  title: myArena Hub REST API, Ludo delta
  version: 0.1.0-draft
  description: >
    Delta over the 001 file merged with the 002 delta. Merge rule used by the contract tests:
    every path item and every component schema defined here replaces the item of the same name
    in the earlier files; everything not listed here is unchanged. The only REST change in this
    feature is an optional picture name on a catalog entry. Game traffic uses the WebSocket
    game channel (see game-channel.md), not REST.
servers:
  - url: /
paths: {}
components:
  schemas:
    CatalogEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - category
        - status
        - test
        - minParticipants
        - maxParticipants
        - defaultParticipants
        - durationMinutes
        - modes
        - art
      properties:
        id: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
        name: { type: string, minLength: 1, maxLength: 40 }
        description: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 30 }
        status: { type: string, enum: [PLAYABLE, COMING_SOON] }
        test:
          type: boolean
          description: True for test games, which the page labels "Test game"
        minParticipants: { type: integer, minimum: 1, maximum: 100 }
        maxParticipants: { type: integer, minimum: 1, maximum: 100 }
        defaultParticipants: { type: integer, minimum: 1, maximum: 100 }
        durationMinutes:
          type: object
          additionalProperties: false
          required: [min, max]
          properties:
            min: { type: integer, minimum: 1, maximum: 600 }
            max: { type: integer, minimum: 1, maximum: 600 }
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [SOLO_AI, ONLINE] }
          description: Ways the game supports. A COMING_SOON entry lists intended modes but offers none.
        art:
          type: object
          additionalProperties: false
          required: [icon, palette]
          properties:
            icon:
              type: string
              enum: [TARGET, SNAKE, TICKET, PALETTE, CROWN, DICE, DISCS, FLASK]
            palette:
              type: string
              enum: [CRIMSON, EMERALD, AMBER, VIOLET, INDIGO, ROSE, TEAL, SLATE]
            image:
              type: string
              enum: [LUDO]
              description: >
                Optional name of a picture the web app ships for this game. It is a name from a
                fixed list, never a URL; the web app maps it to its own file. When it is absent,
                or the picture cannot load, the icon and palette are used.
