# Render Blueprint: one Web Service on the Free plan. Connect the repo and Render applies this file.
services:
  - type: web
    name: myarena
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # PORT is provided by Render (10000). The server binds 0.0.0.0:$PORT.
      # No secrets are needed. Optional tunables: LOG_LEVEL, MAX_ROOMS, RECONNECT_WINDOW_MS, REMOVAL_COOLDOWN_MS.
